name: MATLAB CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test-getwaveforms-mergepoints:
    runs-on: ubuntu-latest
    env:
      MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          products: >
            Signal_Processing_Toolbox
            Curve_Fitting_Toolbox
            Statistics_and_Machine_Learning_Toolbox

      - name: Run getWaveformsFromDat mergepoints test
        uses: matlab-actions/run-command@v2
        with:
          command: addpath(genpath(pwd)); results = runtests('tests/test_getWaveformsFromDat_mergepoints.m'); assertSuccess(results);

      - name: Run curve-fitting tests with Curve Fitting Toolbox
        uses: matlab-actions/run-command@v2
        with:
          command: addpath(genpath(pwd)); ci_run_bounded_curve_fit('licensed');

  test-curve-fitting-fallback:
    runs-on: ubuntu-latest
    env:
      MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MATLAB without Curve Fitting Toolbox
        uses: matlab-actions/setup-matlab@v2
        with:
          products: >
            Signal_Processing_Toolbox
            Statistics_and_Machine_Learning_Toolbox

      - name: Run curve-fitting fallback tests
        uses: matlab-actions/run-command@v2
        with:
          command: addpath(genpath(pwd)); mexDir = tempname; mkdir(mexDir); mex('-outdir',mexDir,'calc_CellMetrics/mex/CCGHeart.c'); addpath(mexDir); ci_run_bounded_curve_fit('fallback');

  test-image-processing:
    name: Image processing (${{ matrix.mode }})
    runs-on: ubuntu-latest
    env:
      MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: fallback
            products: Signal_Processing_Toolbox
          - mode: licensed
            products: Signal_Processing_Toolbox Image_Processing_Toolbox

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          products: ${{ matrix.products }}

      - name: Run image-processing tests
        uses: matlab-actions/run-command@v2
        with:
          command: addpath(genpath(pwd)); ci_run_image_processing_fallback('${{ matrix.mode }}');
